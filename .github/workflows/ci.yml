name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: syntax check
        run: npm run check
      # 24 is what the desktop app actually ships (Electron 44 bundles node 24).
      # test:posix re-runs both suites with node:path swapped for the posix
      # implementation, so a Windows runner also covers Linux path semantics.
      - name: behaviour sim (no DSH runtime needed)
        run: npm test
